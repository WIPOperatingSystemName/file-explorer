[package]
name = "telorgon-file-explorer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native Telorgon file manager, file chooser portal, and download manager"

[dependencies]
telorgon = { path = "../telorgon/crates/telorgon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
futures-lite = "2.6"
async-io = "2.6"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }

[profile.telorgon-profile]
inherits = "release"
debug = 1
incremental = true
strip = "none"
